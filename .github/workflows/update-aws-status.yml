name: Update AWS status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/update-aws-status.py
      - name: Commit updated AWS status
        run: |
          if git diff --quiet aws-regions.json; then
            echo "No AWS status changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aws-regions.json
          git commit -m "Update AWS status"
          git push
